<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar perfil | Pallas Ateliê</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="./css/style.css">
</head>
<body class="entrar-page">
	<header class="social-header">
		<div class="social-header-content">
			<div class="logo">
				<a href="inicial.html">
					<img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
				</a>
			</div>

			<div class="social-search">
				<i class="bi bi-search" aria-hidden="true"></i>
				<input type="text" placeholder="Pesquisar...">
			</div>

			<div class="social-actions">
				<a href="notificacoes.html" class="icon-badge" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></a>
				<a href="propostas-empresa.html" class="icon-badge propostas-empresa-icon" aria-label="Propostas para empresas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
				<a href="propostas-artista.html" class="icon-badge propostas-artista-icon" aria-label="Propostas para artistas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
				<a href="perfil.html" class="profile-mini">
					<div class="avatar small">U</div>
					<span>Usuário</span>
				</a>
			</div>
		</div>
	</header>

	<main class="container edit-profile-container">
		<div class="frase">Editar perfil</div>
		<div class="divider"></div>

		<form id="edit-profile-form" class="register-form">
			<div class="profile-image-editors">
				<section class="profile-image-editor">
					<h2>Foto de perfil</h2>
					<div class="avatar profile-image-preview" id="profile-avatar-preview" aria-label="Prévia da foto de perfil">U</div>
					<label class="form-label" for="profile-avatar-input">Escolher foto</label>
					<input class="form-input" id="profile-avatar-input" type="file" accept="image/jpeg,image/png,image/webp">
					<button class="profile-image-remove" id="remove-avatar" type="button">Remover foto</button>
				</section>

				<section class="profile-image-editor">
					<h2>Banner</h2>
					<div class="profile-cover-preview" id="profile-cover-preview" aria-label="Prévia do banner"></div>
					<label class="form-label" for="profile-cover-input">Escolher banner</label>
					<input class="form-input" id="profile-cover-input" type="file" accept="image/jpeg,image/png,image/webp">
					<button class="profile-image-remove" id="remove-cover" type="button">Remover banner</button>
				</section>
				<p class="profile-image-hint">Imagens JPG, PNG ou WEBP de até 1 MB.</p>
				<p class="profile-image-message" id="profile-image-message" role="status" aria-live="polite"></p>
			</div>

			<label class="form-label" for="nome">Nome</label>
			<input class="form-input" id="nome" name="nome" type="text" value="Usuário" required>

			<label class="form-label" for="usuario">Nome de usuário</label>
			<input class="form-input" id="usuario" name="usuario" type="text" value="@usuario" required>

			<label class="form-label" for="bio">Biografia</label>
			<textarea class="form-input" id="bio" name="bio" rows="4" placeholder="Conte um pouco sobre você">Biografia do usuário.</textarea>

			<label class="form-label" for="pais">País</label>
			<input class="form-input" id="pais" name="pais" type="text" value="Brasil" required>

			<label class="form-label" for="estado">Estado</label>
			<input class="form-input" id="estado" name="estado" type="text" value="São Paulo" required>

			<label class="form-label" for="cidade">Cidade</label>
			<input class="form-input" id="cidade" name="cidade" type="text" value="São Paulo" required>

			<label class="form-label" for="email">E-mail</label>
			<input class="form-input" id="email" name="email" type="email" value="usuario@email.com" required>

			<label class="form-label" for="numero">Número</label>
			<input class="form-input" id="numero" name="numero" type="tel" value="(00) 00000-0000" required>

			<label class="form-label" for="arte">Tipo de arte</label>
			<input class="form-input" id="arte" name="arte" type="text" value="Desenho digital" required>

			<button class="btn btn-cadastrar register-submit" type="submit">Salvar alterações</button>
			<a href="perfil.html" class="btn btn-entrar back-button">Cancelar</a>
		</form>
	</main>

	<script>
		const header = document.querySelector('.social-header');
		const userType = localStorage.getItem('pallasUserType');
		if (userType === 'empresa') {
			const artistaIcon = document.querySelector('.propostas-artista-icon');
			if (artistaIcon) artistaIcon.style.display = 'none';
		}
		if (userType === 'artista') {
			const empresaIcon = document.querySelector('.propostas-empresa-icon');
			if (empresaIcon) empresaIcon.style.display = 'none';
		}

		const editForm = document.querySelector('#edit-profile-form');
		const savedProfile = JSON.parse(localStorage.getItem('pallasProfile') || 'null');
		const avatarInput = document.querySelector('#profile-avatar-input');
		const coverInput = document.querySelector('#profile-cover-input');
		const avatarPreview = document.querySelector('#profile-avatar-preview');
		const coverPreview = document.querySelector('#profile-cover-preview');
		const imageMessage = document.querySelector('#profile-image-message');
		const maxImageSize = 1024 * 1024;
		const acceptedImageTypes = ['image/jpeg', 'image/png', 'image/webp'];
		let avatarData = savedProfile?.avatar || '';
		let coverData = savedProfile?.cover || '';

		function showAvatar(source) {
			if (source) {
				const image = document.createElement('img');
				image.src = source;
				image.alt = 'Prévia da foto de perfil';
				avatarPreview.replaceChildren(image);
				avatarPreview.classList.add('has-image');
				return;
			}

			avatarPreview.textContent = savedProfile?.nome?.trim()?.charAt(0).toUpperCase() || 'U';
			avatarPreview.classList.remove('has-image');
		}

		function showCover(source) {
			coverPreview.style.backgroundImage = source ? `url("${source}")` : '';
			coverPreview.classList.toggle('has-image', Boolean(source));
		}

		function readImage(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.addEventListener('load', () => {
					if (typeof reader.result === 'string') {
						resolve(reader.result);
					} else {
						reject(new Error('Não foi possível carregar essa imagem.'));
					}
				});
				reader.addEventListener('error', () => reject(new Error('Não foi possível carregar essa imagem.')));
				reader.readAsDataURL(file);
			});
		}

		function watchImageInput(input, showImage) {
			input.addEventListener('change', () => {
				const image = input.files[0];
				if (!image) return;
				if (!acceptedImageTypes.includes(image.type) || image.size > maxImageSize) {
					imageMessage.textContent = 'Escolha uma imagem JPG, PNG ou WEBP de até 1 MB.';
					input.value = '';
					return;
				}

				imageMessage.textContent = '';
				readImage(image).then((source) => {
					if (input.files[0] === image) showImage(source);
				}).catch(() => {
					if (input.files[0] === image) {
						imageMessage.textContent = 'Não foi possível carregar essa imagem. Tente selecionar outro arquivo.';
						input.value = '';
					}
				});
			});
		}

		function removeImage(input, showImage) {
			input.value = '';
			showImage('');
			imageMessage.textContent = '';
		}

		watchImageInput(avatarInput, showAvatar);
		watchImageInput(coverInput, showCover);
		document.querySelector('#remove-avatar').addEventListener('click', () => {
			avatarData = '';
			removeImage(avatarInput, showAvatar);
		});
		document.querySelector('#remove-cover').addEventListener('click', () => {
			coverData = '';
			removeImage(coverInput, showCover);
		});

		if (savedProfile) {
			Object.entries(savedProfile).forEach(([field, value]) => {
				const input = editForm.elements[field];
				if (input) input.value = value;
			});
		}
		showAvatar(avatarData);
		showCover(coverData);

		editForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const profileData = Object.fromEntries(new FormData(event.currentTarget));
			try {
				if (avatarInput.files[0]) avatarData = await readImage(avatarInput.files[0]);
				if (coverInput.files[0]) coverData = await readImage(coverInput.files[0]);
				profileData.avatar = avatarData;
				profileData.cover = coverData;
				localStorage.setItem('pallasProfile', JSON.stringify(profileData));
			} catch (error) {
				imageMessage.textContent = 'Não foi possível salvar as imagens. Tente arquivos menores.';
				return;
			}
			window.location.href = 'perfil.html?updated=true';
		});

		let lastScrollTop = 0;
		window.addEventListener('scroll', () => {
			const currentScroll = window.scrollY;
			if (currentScroll > 80 && currentScroll > lastScrollTop) {
				header.classList.add('is-hidden');
			} else {
				header.classList.remove('is-hidden');
			}
			lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
		});
	</script>
</body>
</html>
