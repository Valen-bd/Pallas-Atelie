<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Pallas Ateliê</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="sobre-page">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="images/pa1.png" id="logimagem" alt="Logo">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link" data-page="home">Início</a></li>
                    <li><a href="sobre.html" class="nav-link" data-page="about">Sobre</a></li>
                    <li><a href="contato.html" class="nav-link active" data-page="contact">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="frase">
                Fale conosco sobre <br> qualquer dúvida ou sugestão que tenha. <br> Estamos prontos para ouvir suas ideias <br> e ajudar você a divulgar seu trabalho.
            </div>
            <div class="divider"></div>
            <form action="#" method="post" class="register-form">
                <label class="form-label" for="nome">Nome</label>
                <input id="nome" name="nome" type="text" class="form-input" placeholder="Seu nome" required>

                <label class="form-label" for="email">E-mail</label>
                <input id="email" name="email" type="email" class="form-input" placeholder="Seu e-mail" required>

                <label class="form-label" for="fone">Telefone</label>
                <input id="fone" name="fone" type="tel" class="form-input" placeholder="Seu telefone" required>

                <label class="form-label" for="assunto">Assunto</label>
                <input id="assunto" name="assunto" type="text" class="form-input" placeholder="Assunto da mensagem" required>

                <label class="form-label" for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" class="form-input" placeholder="Escreva sua mensagem" rows="6" required></textarea>

                <button type="submit" class="btn btn-cadastrar">Enviar mensagem</button>
                <a href="index.html" class="btn btn-entrar back-button">Voltar</a>
            </form>
        </div>
    </main>
</body>
</html>
