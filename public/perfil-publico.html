<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | Pallas Ateliê</title>
    <link rel="shortcut icon" type="image/png" href="images/PA-TCC logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="entrar-page public-profile-page">
    <header class="social-header">
        <div class="social-header-content">
            <div class="logo">
                <a href="inicial.html">
                    <img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
                </a>
            </div>

            <div class="social-actions">
                <a href="notificacoes.html" class="icon-badge" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></a>
                <a href="propostas-empresa.html" class="icon-badge propostas-empresa-icon" aria-label="Propostas para empresas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="propostas-artista.html" class="icon-badge propostas-artista-icon" aria-label="Propostas para artistas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="perfil.html" class="profile-mini">
                    <div class="avatar small">U</div>
                    <span>Meu perfil</span>
                </a>
            </div>
        </div>
    </header>

    <main class="perfil-container" id="public-profile" hidden>
        <section class="perfil-card perfil-social">
            <div class="perfil-cover"></div>

            <div class="perfil-hero">
                <div class="avatar perfil-avatar" id="public-avatar" aria-hidden="true"></div>
                <div class="perfil-identidade">
                    <h1 id="public-name"></h1>
                    <p id="public-handle"></p>
                </div>
                <div class="perfil-actions">
                    <a href="outros.html" class="perfil-btn perfil-btn-secondary"><i class="bi bi-people" aria-hidden="true"></i> Ver outros perfis</a>
                </div>
            </div>

            <div class="perfil-bio-box">
                <p id="public-bio"></p>
            </div>

            <div class="perfil-stats">
                <div class="stat-card">
                    <strong id="public-post-count"></strong>
                    <span>Publicações</span>
                </div>
                <div class="stat-card">
                    <strong id="public-followers"></strong>
                    <span>Seguidores</span>
                </div>
                <div class="stat-card">
                    <strong id="public-following"></strong>
                    <span>Seguindo</span>
                </div>
            </div>

            <div class="perfil-content-grid">
                <section class="perfil-info-panel">
                    <h3>Sobre</h3>
                    <div class="perfil-lista">
                        <p><span class="perfil-label">Tipo de perfil:</span> <span id="public-type"></span></p>
                        <p><span class="perfil-label">Área:</span> <span id="public-area"></span></p>
                        <p><span class="perfil-label">Cidade:</span> <span id="public-city"></span></p>
                        <p><span class="perfil-label">Estado:</span> <span id="public-state"></span></p>
                    </div>
                </section>

                <section class="perfil-feed-panel">
                    <h3>Publicações recentes</h3>
                    <article class="post-card profile-post">
                        <div class="post-header">
                            <div class="post-user">
                                <div class="avatar small public-post-avatar" aria-hidden="true"></div>
                                <div>
                                    <strong class="public-post-author"></strong>
                                    <p>Publicação em destaque</p>
                                </div>
                            </div>
                            <span class="tag">Portfólio</span>
                        </div>
                        <p class="public-post-caption"></p>
                        <img src="images/pallas2.png" alt="Trabalho artístico em destaque">
                    </article>
                </section>
            </div>
        </section>
    </main>

    <main class="public-profile-error" id="profile-error" hidden>
        <h1>Perfil não encontrado</h1>
        <p>Não foi possível encontrar esse perfil. Confira o endereço ou explore outros perfis.</p>
        <a href="outros.html">Explorar perfis</a>
    </main>

    <script>
        const profiles = {
            'marina-costa': {
                name: 'Marina Costa',
                handle: '@marinacosta.art',
                type: 'Artista',
                area: 'Ilustração e aquarela',
                city: 'Florianópolis',
                state: 'SC',
                bio: 'Ilustradora apaixonada por cores, natureza e narrativas visuais.',
                followers: 248,
                following: 180,
                post: 'Estudo de cores e formas inspirado pelas paisagens e pela natureza.'
            },
            'rafael-almeida': {
                name: 'Rafael Almeida',
                handle: '@rafaelalmeida.design',
                type: 'Artista',
                area: 'Design gráfico e identidade visual',
                city: 'Curitiba',
                state: 'PR',
                bio: 'Designer gráfico criando identidades visuais com personalidade.',
                followers: 192,
                following: 146,
                post: 'Exploração de formas e tipografia para uma identidade visual autoral.'
            },
            'estudio-aurora': {
                name: 'Estúdio Aurora',
                handle: '@estudioaurora',
                type: 'Empresa',
                area: 'Estúdio criativo e colaborações',
                city: 'São Paulo',
                state: 'SP',
                bio: 'Estúdio independente que conecta arte, design e projetos locais.',
                followers: 560,
                following: 210,
                post: 'Nosso espaço está aberto para novas ideias e colaborações criativas.'
            },
            'beatriz-lima': {
                name: 'Beatriz Lima',
                handle: '@bia.lima.art',
                type: 'Artista',
                area: 'Cerâmica e artesanato',
                city: 'Belo Horizonte',
                state: 'MG',
                bio: 'Ceramista e artesã; transformo ideias em peças feitas à mão.',
                followers: 315,
                following: 202,
                post: 'Peças artesanais feitas à mão, com texturas e formas inspiradas no cotidiano.'
            },
            'casa-linha': {
                name: 'Casa Linha',
                handle: '@casalinha',
                type: 'Empresa',
                area: 'Decoração e arte local',
                city: 'Recife',
                state: 'PE',
                bio: 'Marca de decoração que valoriza o trabalho de artistas brasileiros.',
                followers: 734,
                following: 128,
                post: 'Uma seleção de trabalhos de artistas brasileiros para trazer mais arte para casa.'
            },
            'joao-pedro-santos': {
                name: 'João Pedro Santos',
                handle: '@jpsantos.ilustra',
                type: 'Artista',
                area: 'Arte digital e concept art',
                city: 'Porto Alegre',
                state: 'RS',
                bio: 'Ilustração digital e concept art inspirados por fantasia e cultura pop.',
                followers: 421,
                following: 267,
                post: 'Estudo de personagem e cenário para um novo projeto de fantasia.'
            }
        };

        const profile = profiles[new URLSearchParams(window.location.search).get('perfil')];
        const profilePage = document.querySelector('#public-profile');
        const profileError = document.querySelector('#profile-error');

        if (!profile) {
            profileError.hidden = false;
        } else {
            profilePage.hidden = false;
            document.title = `${profile.name} | Pallas Ateliê`;
            document.querySelector('#public-name').textContent = profile.name;
            document.querySelector('#public-handle').textContent = `${profile.handle} • ${profile.type}`;
            document.querySelector('#public-bio').textContent = profile.bio;
            document.querySelector('#public-post-count').textContent = '1';
            document.querySelector('#public-followers').textContent = profile.followers;
            document.querySelector('#public-following').textContent = profile.following;
            document.querySelector('#public-type').textContent = profile.type;
            document.querySelector('#public-area').textContent = profile.area;
            document.querySelector('#public-city').textContent = profile.city;
            document.querySelector('#public-state').textContent = profile.state;
            document.querySelector('#public-avatar').textContent = profile.name.split(/\s+/).map((part) => part[0]).slice(0, 2).join('').toUpperCase();
            document.querySelectorAll('.public-post-avatar').forEach((avatar) => {
                avatar.textContent = profile.name.split(/\s+/).map((part) => part[0]).slice(0, 2).join('').toUpperCase();
            });
            document.querySelectorAll('.public-post-author').forEach((author) => {
                author.textContent = profile.name;
            });
            document.querySelector('.public-post-caption').textContent = profile.post;
        }

        const userType = localStorage.getItem('pallasUserType');
        if (userType === 'empresa') {
            document.querySelector('.propostas-artista-icon').style.display = 'none';
        }
        if (userType === 'artista') {
            document.querySelector('.propostas-empresa-icon').style.display = 'none';
        }

        const savedProfile = JSON.parse(localStorage.getItem('pallasProfile') || 'null');
        if (savedProfile?.nome?.trim()) {
            const miniAvatar = document.querySelector('.profile-mini .avatar');
            miniAvatar.textContent = savedProfile.nome.trim().charAt(0).toUpperCase();
            document.querySelector('.profile-mini span').textContent = savedProfile.nome.trim();
        }

        const header = document.querySelector('.social-header');
        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;
            if (currentScroll > 80 && currentScroll > lastScrollTop) {
                header.classList.add('is-hidden');
            } else {
                header.classList.remove('is-hidden');
            }
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });
    </script>
</body>
</html>
