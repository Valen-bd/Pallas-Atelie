<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Artista - Pallas Ateliê</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="register-page">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="images/pa1.png" id="logimagem" alt="Logo">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link" data-page="home">Início</a></li>
                    <li><a href="sobre.html" class="nav-link" data-page="about">Sobre</a></li>
                    <li><a href="index.html#contato" class="nav-link" data-page="contact">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="frase">Cadastro de Artista</div>
            <div class="divider"></div>

            <form action="#" method="post" class="register-form">
                <label class="form-label" for="nome">Nome </label>
                <input id="nome" name="nome" type="text" class="form-input" placeholder="Digite seu nome" required>

                <label class="form-label" for="nome-artistico">Nome Artístico</label>
                <input id="nome-artistico" name="nome-artistico" type="text" class="form-input" placeholder="Digite seu nome artístico" required>

                <label class="form-label" for="email">E-mail</label>
                <input id="email" name="email" type="email" class="form-input" placeholder="Digite seu e-mail" required>

                <label class="form-label" for="pais">País</label>
                <input id="pais" name="pais" type="text" class="form-input" placeholder="Ex: Brasil" required>

                <label class="form-label" for="estado">Estado</label>
                <input id="estado" name="estado" type="text" class="form-input" placeholder="Ex: São Paulo" required>

                <label class="form-label" for="cidade">Cidade</label>
                <input id="cidade" name="cidade" type="text" class="form-input" placeholder="Ex: São Paulo" required>

                <label class="form-label" for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text" class="form-input" placeholder="000.000.000-00" required>

                <label class="form-label" for="fone">Fone</label>
                <input id="fone" name="fone" type="text" class="form-input" placeholder="(00) 00000-0000" required>

                <label class="form-label" for="tipo">Tipo de arte</label>
                <input id="tipo" name="tipo" type="text" class="form-input" placeholder="Ex: pintura, cerâmica, digital" required>

                <label class="form-label" for="senha">Senha</label>
                <input id="senha" name="senha" type="password" class="form-input" placeholder="Crie uma senha" required>

                <label class="form-label" for="confirmar-senha">Confirmar senha</label>
                <input id="confirmar-senha" name="confirmar-senha" type="password" class="form-input" placeholder="Repita a senha" required>

                <button type="submit" class="btn btn-cadastrar register-submit">Cadastrar-se como Artista</button>
            </form>

            <div class="divider"></div>
            <a href="cadastrar.html" class="btn btn-entrar back-button">Voltar</a>
        </div>
    </main>
</body>
</html>
