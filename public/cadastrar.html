<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se - Pallas Ateliê</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="register-page">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="images/pa1.png" id="logimagem" alt="Logo">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link" data-page="home">Início</a></li>
                    <li><a href="sobre.html" class="nav-link" data-page="about">Sobre</a></li>
                    <li><a href="contato.html" class="nav-link" data-page="contact">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="frase">Escolha a forma que deseja criar sua conta</div>
            <div class="divider"></div>

            <form action="#" method="post" class="register-form">
                <div class="profile-switcher">
                    <label class="profile-card selected" for="tipo-artista">
                        <input id="tipo-artista" type="radio" name="tipo" value="artista" checked>
                        <div>
                            <strong>Artista</strong>
                            
                        </div>
                    </label>
                    <label class="profile-card" for="tipo-empresa">
                        <input id="tipo-empresa" type="radio" name="tipo" value="empresa">
                        <div>
                            <strong>Empresa</strong>
                            
                        </div>
                    </label>
                </div>

                <button type="submit" class="btn btn-cadastrar register-submit">Continuar</button>
            </form>

            <div class="divider"></div>
            <a href="index.html" class="btn btn-entrar back-button">Voltar ao Início</a>
        </div>
    </main>
    <script>
        const profileCards = document.querySelectorAll('.profile-card');
        const updateSelected = () => {
            profileCards.forEach(card => {
                const input = card.querySelector('input[type="radio"]');
                card.classList.toggle('selected', input.checked);
            });
        };
        profileCards.forEach(card => {
            const input = card.querySelector('input[type="radio"]');
            input.addEventListener('change', updateSelected);
        });
        updateSelected();

        document.querySelector('.register-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const selectedType = document.querySelector('input[name="tipo"]:checked').value;
            localStorage.setItem('pallasUserType', selectedType);
            if (selectedType === 'artista') {
                window.location.href = 'cadastrar-artista.html';
            } else {
                window.location.href = 'cadastrar-empresa.html?tipo=empresa';
            }
        });
    </script>
</body>
</html>
