<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Editar perfil | Pallas Ateliê</title>
	<link rel="shortcut icon" type="image/png" href="images/PA-TCC logo.png">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" href="./css/style.css">
	<script src="./js/user-session.js"></script>
	<script src="./js/form-helpers.js"></script>
</head>
<body class="entrar-page">
	<header class="social-header">
		<div class="social-header-content">
			<div class="logo">
				<a href="inicial.html">
					<img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
				</a>
			</div>

			<div class="social-search">
				<i class="bi bi-search" aria-hidden="true"></i>
				<input type="text" placeholder="Pesquisar...">
			</div>

			<div class="social-actions">
				<a href="notificacoes.html" class="icon-badge" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></a>
				<a href="propostas-empresa.html" class="icon-badge propostas-empresa-icon" aria-label="Propostas para empresas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
				<a href="propostas-artista.html" class="icon-badge propostas-artista-icon" aria-label="Propostas para artistas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
				<a href="perfil.html" class="profile-mini">
					<div class="avatar small">U</div>
					<span>Usuário</span>
				</a>
			</div>
		</div>
	</header>

	<main class="container edit-profile-container">
		<div class="frase">Editar perfil</div>
		<div class="divider"></div>

		<form id="edit-profile-form" class="register-form">
			<div class="profile-image-editors">
				<section class="profile-image-editor">
					<h2>Foto de perfil</h2>
					<div class="avatar profile-image-preview" id="profile-avatar-preview" aria-label="Prévia da foto de perfil">U</div>
					<label class="form-label" for="profile-avatar-input">Escolher foto</label>
					<input class="form-input" id="profile-avatar-input" type="file" accept="image/jpeg,image/png,image/webp">
					<button class="profile-image-remove" id="remove-avatar" type="button">Remover foto</button>
				</section>

				<section class="profile-image-editor">
					<h2>Banner</h2>
					<div class="profile-cover-preview" id="profile-cover-preview" aria-label="Prévia do banner"></div>
					<label class="form-label" for="profile-cover-input">Escolher banner</label>
					<input class="form-input" id="profile-cover-input" type="file" accept="image/jpeg,image/png,image/webp">
					<button class="profile-image-remove" id="remove-cover" type="button">Remover banner</button>
				</section>
				<p class="profile-image-hint">Imagens JPG, PNG ou WEBP de até 10 MB (compactação automática).</p>
				<p class="profile-image-message" id="profile-image-message" role="status" aria-live="polite"></p>
			</div>

			<label class="form-label" for="nome">Nome</label>
			<input class="form-input" id="nome" name="nome" type="text" placeholder="Seu nome ou nome artístico" required>

			<label class="form-label" for="usuario">Nome de usuário</label>
			<input class="form-input" id="usuario" name="usuario" type="text" placeholder="@usuario" required>

			<label class="form-label" for="bio">Biografia</label>
			<textarea class="form-input" id="bio" name="bio" rows="4" placeholder="Conte um pouco sobre você"></textarea>

			<label class="form-label" for="pais">País</label>
			<input class="form-input" id="pais" name="pais" type="text" value="Brasil" required>

			<label class="form-label" for="estado">Estado</label>
			<input class="form-input" id="estado" name="estado" type="text" placeholder="Estado (ex: SC)" required>

			<label class="form-label" for="cidade">Cidade</label>
			<input class="form-input" id="cidade" name="cidade" type="text" placeholder="Cidade" required>

			<label class="form-label" for="email">E-mail</label>
			<input class="form-input" id="email" name="email" type="email" placeholder="email@exemplo.com" required>

			<label class="form-label" for="numero">Telefone</label>
			<input class="form-input" id="numero" name="numero" type="tel" placeholder="(00) 00000-0000" required>

			<label class="form-label" for="arte">Tipo de arte</label>
			<input class="form-input" id="arte" name="arte" type="text" placeholder="Ex: Desenho digital, Pintura" required>

			<button class="btn btn-cadastrar register-submit" type="submit">Salvar alterações</button>
			<a href="perfil.html" class="btn btn-entrar back-button">Cancelar</a>
		</form>
	</main>

	<script>
		const header = document.querySelector('.social-header');
		const userType = localStorage.getItem('pallasUserType');
		if (userType === 'empresa') {
			const artistaIcon = document.querySelector('.propostas-artista-icon');
			if (artistaIcon) artistaIcon.style.display = 'none';
		} else {
			const empresaIcon = document.querySelector('.propostas-empresa-icon');
			if (empresaIcon) empresaIcon.style.display = 'none';
		}

		const editForm = document.querySelector('#edit-profile-form');
		const avatarInput = document.querySelector('#profile-avatar-input');
		const coverInput = document.querySelector('#profile-cover-input');
		const avatarPreview = document.querySelector('#profile-avatar-preview');
		const coverPreview = document.querySelector('#profile-cover-preview');
		const imageMessage = document.querySelector('#profile-image-message');
		const maxImageSize = 10 * 1024 * 1024;
		const acceptedImageTypes = ['image/jpeg', 'image/png', 'image/webp'];

		// Recuperar dados do usuário atual do localStorage
		const userData = JSON.parse(localStorage.getItem('pallasUser') || '{}');
		const perfilType = localStorage.getItem('pallasUserType') || userData.tipo_perfil || 'artista';
		const usuarioId = userData.usuario_id || userData.perfil?.usuario_id || userData.perfil?._id || userData._id;

		const currentProfileKey = usuarioId ? `pallasProfile_${usuarioId}` : 'pallasProfile';
		let savedProfile = JSON.parse(localStorage.getItem(currentProfileKey) || localStorage.getItem('pallasProfile') || 'null');

		let avatarData = '';
		let coverData = '';

		function showAvatar(source, fallbackName = '') {
			if (source) {
				const image = document.createElement('img');
				image.src = source;
				image.alt = 'Prévia da foto de perfil';
				image.style.width = '100%';
				image.style.height = '100%';
				image.style.objectFit = 'cover';
				image.style.borderRadius = '50%';
				avatarPreview.replaceChildren(image);
				avatarPreview.classList.add('has-image');
				return;
			}
			const letter = (fallbackName || editForm.elements['nome']?.value || 'U').trim().charAt(0).toUpperCase();
			avatarPreview.textContent = letter || 'U';
			avatarPreview.classList.remove('has-image');
		}

		function showCover(source) {
			coverPreview.style.backgroundImage = source ? `url("${source}")` : '';
			coverPreview.classList.toggle('has-image', Boolean(source));
		}

		// Preenche os campos do formulário com dados do perfil
		function populateFormFields(dados) {
			if (!dados) return;

			const name = dados.nome || dados.nome_artistico || dados.nome_fantasia || '';
			const username = dados.usuario ? String(dados.usuario).replace(/^@/, '') : (userData.login ? String(userData.login).replace(/^@/, '') : '');
			const bio = dados.bio || '';
			const pais = dados.pais || dados.endereco?.pais || 'Brasil';
			const estado = dados.estado || dados.endereco?.uf || '';
			const cidade = dados.cidade || dados.endereco?.cidade || '';
			const email = dados.email || userData.email || '';
			const numero = dados.numero || dados.fone || '';
			const arte = Array.isArray(dados.arte) ? dados.arte.join(', ') : (Array.isArray(dados.tipo_arte) ? dados.tipo_arte.join(', ') : (dados.arte || dados.tipo_arte || ''));

			if (name && editForm.elements['nome']) editForm.elements['nome'].value = name;
			if (username && editForm.elements['usuario']) editForm.elements['usuario'].value = `@${username}`;
			if (editForm.elements['bio']) editForm.elements['bio'].value = bio;
			if (pais && editForm.elements['pais']) editForm.elements['pais'].value = pais;
			if (estado && editForm.elements['estado']) editForm.elements['estado'].value = estado;
			if (cidade && editForm.elements['cidade']) editForm.elements['cidade'].value = cidade;
			if (email && editForm.elements['email']) editForm.elements['email'].value = email;
			if (numero && editForm.elements['numero']) editForm.elements['numero'].value = numero;
			if (arte && editForm.elements['arte']) editForm.elements['arte'].value = arte;

			avatarData = dados.avatar || avatarData || '';
			coverData = dados.cover || coverData || '';

			showAvatar(avatarData, name);
			showCover(coverData);
		}

		// 1. Preenche imediatamente com o cache local (se houver)
		if (savedProfile) {
			populateFormFields(savedProfile);
		} else if (userData.perfil) {
			populateFormFields(userData.perfil);
		}

		// 2. Busca os dados mais recentes diretamente do MongoDB no backend
		async function fetchFreshProfileFromBackend() {
			if (!usuarioId || !perfilType) return;
			try {
				const res = await fetch(`/api/perfil/${perfilType}/${usuarioId}`);
				const json = await res.json();
				if (res.ok && json.sucesso && json.dados) {
					populateFormFields(json.dados);
				}
			} catch (e) {
				console.warn('Usando dados em cache:', e);
			}
		}
		fetchFreshProfileFromBackend();

		// Compressão de imagens em Canvas
		function compressImageFile(file, maxWidth, maxHeight, quality = 0.8) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = (e) => {
					const img = new Image();
					img.onload = () => {
						let width = img.width;
						let height = img.height;

						if (width > maxWidth || height > maxHeight) {
							if (width / height > maxWidth / maxHeight) {
								height = Math.round((height * maxWidth) / width);
								width = maxWidth;
							} else {
								width = Math.round((width * maxHeight) / height);
								height = maxHeight;
							}
						}

						const canvas = document.createElement('canvas');
						canvas.width = width;
						canvas.height = height;
						const ctx = canvas.getContext('2d');
						ctx.drawImage(img, 0, 0, width, height);

						let compressedData = canvas.toDataURL('image/webp', quality);
						if (!compressedData.startsWith('data:image/webp')) {
							compressedData = canvas.toDataURL('image/jpeg', quality);
						}
						resolve(compressedData);
					};
					img.onerror = () => reject(new Error('Falha ao processar arquivo de imagem.'));
					img.src = e.target.result;
				};
				reader.onerror = () => reject(new Error('Falha ao ler arquivo.'));
				reader.readAsDataURL(file);
			});
		}

		function watchImageInput(input, showImage, isAvatar = true) {
			input.addEventListener('change', async () => {
				const image = input.files[0];
				if (!image) return;
				if (!acceptedImageTypes.includes(image.type) || image.size > maxImageSize) {
					imageMessage.textContent = 'Escolha uma imagem JPG, PNG ou WEBP de até 10 MB.';
					input.value = '';
					return;
				}

				imageMessage.textContent = 'Processando imagem...';
				try {
					const maxWidth = isAvatar ? 400 : 1200;
					const maxHeight = isAvatar ? 400 : 500;
					const compressed = await compressImageFile(image, maxWidth, maxHeight, 0.82);
					if (input.files[0] === image) {
						if (isAvatar) avatarData = compressed;
						else coverData = compressed;
						showImage(compressed);
						imageMessage.textContent = '';
					}
				} catch (err) {
					imageMessage.textContent = 'Não foi possível carregar essa imagem. Tente selecionar outro arquivo.';
					input.value = '';
				}
			});
		}

		function removeImage(input, showImage) {
			input.value = '';
			showImage('');
			imageMessage.textContent = '';
		}

		watchImageInput(avatarInput, showAvatar, true);
		watchImageInput(coverInput, showCover, false);

		document.querySelector('#remove-avatar').addEventListener('click', () => {
			avatarData = '';
			removeImage(avatarInput, showAvatar);
		});
		document.querySelector('#remove-cover').addEventListener('click', () => {
			coverData = '';
			removeImage(coverInput, showCover);
		});

		function safeSaveLocalStorage(key, value) {
			try {
				localStorage.setItem(key, value);
			} catch (e) {
				console.warn('LocalStorage cheio ou inacessível ao salvar chave:', key);
			}
		}

		editForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const submitBtn = editForm.querySelector('button[type="submit"]');
			if (submitBtn) submitBtn.disabled = true;
			imageMessage.textContent = 'Salvando alterações...';

			const profileData = Object.fromEntries(new FormData(event.currentTarget));
			try {
				if (avatarInput.files[0] && (!avatarData || avatarData.length > 500000)) {
					avatarData = await compressImageFile(avatarInput.files[0], 400, 400, 0.82);
				}
				if (coverInput.files[0] && (!coverData || coverData.length > 800000)) {
					coverData = await compressImageFile(coverInput.files[0], 1200, 500, 0.80);
				}

				profileData.avatar = avatarData;
				profileData.cover = coverData;

				if (usuarioId && perfilType) {
					const response = await fetch(`/api/perfil/${perfilType}/${usuarioId}`, {
						method: 'PUT',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({
							...profileData,
							usuario: profileData.usuario,
							avatar: avatarData,
							cover: coverData,
							bio: profileData.bio,
							arte: profileData.arte,
							pais: profileData.pais,
							estado: profileData.estado,
							cidade: profileData.cidade,
							email: profileData.email,
							fone: profileData.numero,
							nome: profileData.nome,
							nome_artistico: profileData.nome,
							nome_fantasia: profileData.nome,
							responsavel: profileData.nome
						})
					});

					const resData = await response.json().catch(() => ({}));
					if (!response.ok) {
						throw new Error(resData.mensagem || 'Falha ao persistir no servidor.');
					}

					if (resData.dados) {
						if (resData.dados.avatar) avatarData = resData.dados.avatar;
						if (resData.dados.cover) coverData = resData.dados.cover;
					}
				}

				// Salvar no cache com a chave do usuário logado e também a geral
				profileData.avatar = avatarData;
				profileData.cover = coverData;
				safeSaveLocalStorage(currentProfileKey, JSON.stringify(profileData));
				safeSaveLocalStorage('pallasProfile', JSON.stringify(profileData));

				const updatedUser = JSON.parse(localStorage.getItem('pallasUser') || '{}');
				updatedUser.perfil = updatedUser.perfil || {};
				updatedUser.perfil.nome = profileData.nome;
				updatedUser.perfil.avatar = avatarData;
				updatedUser.perfil.cover = coverData;
				updatedUser.perfil.bio = profileData.bio;
				safeSaveLocalStorage('pallasUser', JSON.stringify(updatedUser));

			} catch (error) {
				console.error('Erro ao salvar perfil:', error);
				imageMessage.textContent = error.message || 'Não foi possível salvar as imagens. Tente outros arquivos.';
				if (submitBtn) submitBtn.disabled = false;
				return;
			}

			window.location.href = 'perfil.html?updated=true';
		});

		let lastScrollTop = 0;
		window.addEventListener('scroll', () => {
			const currentScroll = window.scrollY;
			if (currentScroll > 80 && currentScroll > lastScrollTop) {
				header.classList.add('is-hidden');
			} else {
				header.classList.remove('is-hidden');
			}
			lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
		});
	</script>
</body>
</html>
