<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrir perfis | Pallas Ateliê</title>
    <link rel="shortcut icon" type="image/png" href="images/PA-TCC logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/user-session.js"></script>
</head>
<body class="entrar-page discover-page">
    <header class="social-header">
        <div class="social-header-content">
            <div class="logo">
                <a href="inicial.html">
                    <img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
                </a>
            </div>

            <label class="social-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input id="profile-search" type="search" placeholder="Pesquisar perfis..." aria-label="Pesquisar perfis">
            </label>

            <div class="social-actions">
                <a href="notificacoes.html" class="icon-badge" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></a>
                <a href="propostas-empresa.html" class="icon-badge propostas-empresa-icon" aria-label="Propostas para empresas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="propostas-artista.html" class="icon-badge propostas-artista-icon" aria-label="Propostas para artistas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="perfil.html" class="profile-mini">
                    <div class="avatar small">U</div>
                    <span>Meu perfil</span>
                </a>
            </div>
        </div>
    </header>

    <main class="discover-container">
        <a href="inicial.html" class="discover-back"><i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar ao início</a>
        <section class="discover-heading" aria-labelledby="discover-title">
            <span class="discover-eyebrow"><i class="bi bi-compass" aria-hidden="true"></i> Comunidade Pallas</span>
            <h1 id="discover-title">Descubra novos perfis</h1>
            <p>Conheça artistas e empresas, explore seus trabalhos e encontre inspiração para novas conexões.</p>
        </section>

        <section class="discover-controls" aria-label="Filtros de perfis">
            <div class="discover-filters" role="group" aria-label="Filtrar por tipo de perfil">
                <button class="discover-filter is-active" type="button" data-filter="todos" aria-pressed="true">Todos</button>
                <button class="discover-filter" type="button" data-filter="artista" aria-pressed="false">Artistas</button>
                <button class="discover-filter" type="button" data-filter="empresa" aria-pressed="false">Empresas</button>
            </div>
            <p class="discover-count" aria-live="polite"><strong id="profile-count">0</strong> perfis encontrados</p>
        </section>

        <p class="discover-empty" id="profile-status" aria-live="polite">Carregando perfis...</p>
        <section class="discover-grid" id="profile-grid" aria-label="Perfis da comunidade" aria-busy="true">
        </section>

        <p class="discover-empty" id="profile-empty" hidden>Nenhum perfil encontrado. Tente outro nome ou filtro.</p>
    </main>

    <dialog class="image-viewer" id="image-viewer" aria-label="Visualização da imagem">
        <button class="image-viewer-close" type="button" aria-label="Fechar visualização">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
        <img id="image-viewer-content" alt="">
    </dialog>

    <script>
        const header = document.querySelector('.social-header');
        const userType = localStorage.getItem('pallasUserType');
        if (userType === 'empresa') {
            document.querySelector('.propostas-artista-icon').style.display = 'none';
        }
        if (userType === 'artista') {
            document.querySelector('.propostas-empresa-icon').style.display = 'none';
        }

        const searchInput = document.querySelector('#profile-search');
        const searchTerm = new URLSearchParams(window.location.search).get('q') || '';
        searchInput.value = searchTerm;
        const filterButtons = document.querySelectorAll('.discover-filter');
        const profileGrid = document.querySelector('#profile-grid');
        const profileCount = document.querySelector('#profile-count');
        const emptyState = document.querySelector('#profile-empty');
        const statusMessage = document.querySelector('#profile-status');
        const imageViewer = document.querySelector('#image-viewer');
        const imageViewerContent = document.querySelector('#image-viewer-content');
        let selectedFilter = 'todos';
        let profileCards = [];
        let currentSearchRequest = 0;

        profileGrid.addEventListener('click', (event) => {
            const button = event.target.closest('.discover-avatar-button');
            if (!button) return;

            const image = button.querySelector('img');
            if (!image) return;

            imageViewerContent.src = image.src;
            imageViewerContent.alt = button.getAttribute('aria-label');
            imageViewer.showModal();
        });

        imageViewer.querySelector('.image-viewer-close').addEventListener('click', () => {
            imageViewer.close();
        });
        imageViewer.addEventListener('click', (event) => {
            if (event.target === imageViewer) imageViewer.close();
        });
        imageViewer.addEventListener('close', () => {
            imageViewerContent.removeAttribute('src');
            imageViewerContent.alt = '';
        });

        function readStoredJson(key, fallback) {
            try {
                return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback));
            } catch (error) {
                console.error(`Não foi possível ler ${key} da sessão:`, error);
                return fallback;
            }
        }

        function createProfileCard(profile, index) {
            const category = profile.tipo === 'Empresa' ? 'empresa' : 'artista';
            const card = document.createElement('article');
            card.className = 'discover-card';
            card.dataset.category = category;

            const top = document.createElement('div');
            top.className = 'discover-card-top';
            const avatar = document.createElement(profile.avatar ? 'button' : 'div');
            avatar.className = `avatar discover-avatar ${['avatar-coral', 'avatar-blue', 'avatar-green', 'avatar-violet', 'avatar-gold', 'avatar-pink'][index % 6]}`;
            avatar.setAttribute('aria-hidden', 'true');
            if (profile.avatar) {
                avatar.type = 'button';
                avatar.classList.add('discover-avatar-button');
                avatar.setAttribute('aria-label', `Visualizar foto de ${profile.nome || 'Usuário'}`);
                avatar.removeAttribute('aria-hidden');
                const image = document.createElement('img');
                image.src = profile.avatar;
                image.alt = '';
                image.style.width = '100%';
                image.style.height = '100%';
                image.style.objectFit = 'cover';
                image.style.borderRadius = '50%';
                avatar.appendChild(image);
            } else {
                avatar.textContent = (profile.nome || 'U').trim().charAt(0).toUpperCase();
            }

            const type = document.createElement('span');
            type.className = 'discover-type';
            const typeIcon = document.createElement('i');
            typeIcon.className = category === 'empresa' ? 'bi bi-building' : 'bi bi-brush';
            typeIcon.setAttribute('aria-hidden', 'true');
            type.append(typeIcon, document.createTextNode(` ${profile.tipo}`));
            top.append(avatar, type);

            const name = document.createElement('h2');
            name.textContent = profile.nome || 'Usuário';
            const handle = document.createElement('p');
            handle.className = 'discover-handle';
            handle.textContent = profile.login || '';
            const bio = document.createElement('p');
            bio.className = 'discover-bio';
            bio.textContent = profile.bio || 'Sem biografia informada.';

            const tags = document.createElement('div');
            tags.className = 'discover-tags';
            (profile.area || 'Artes Visuais').split(',').map(tag => tag.trim()).filter(Boolean).forEach((tag) => {
                const tagElement = document.createElement('span');
                tagElement.textContent = tag;
                tags.appendChild(tagElement);
            });

            const location = document.createElement('p');
            location.className = 'discover-location';
            const locationIcon = document.createElement('i');
            locationIcon.className = 'bi bi-geo-alt';
            locationIcon.setAttribute('aria-hidden', 'true');
            const locationText = [profile.cidade || 'Não informada', profile.estado || 'BR'].join(', ');
            location.append(locationIcon, document.createTextNode(` ${locationText}`));

            const link = document.createElement('a');
            link.className = 'discover-profile-link';
            link.href = `perfil-publico.html?id=${encodeURIComponent(profile.id)}`;
            link.append(document.createTextNode('Ver perfil '));
            const linkIcon = document.createElement('i');
            linkIcon.className = 'bi bi-arrow-right';
            linkIcon.setAttribute('aria-hidden', 'true');
            link.appendChild(linkIcon);

            card.append(top, name, handle, bio, tags, location, link);
            return card;
        }

        function updateProfiles() {
            if (profileGrid.getAttribute('aria-busy') === 'true') return;

            const searchTerm = searchInput.value.trim().toLocaleLowerCase('pt-BR');
            let visibleCount = 0;

            profileCards.forEach((card) => {
                const matchesFilter = selectedFilter === 'todos' || card.dataset.category === selectedFilter;
                const matchesSearch = card.textContent.toLocaleLowerCase('pt-BR').includes(searchTerm);
                const isVisible = matchesFilter && matchesSearch;
                card.hidden = !isVisible;
                if (isVisible) visibleCount += 1;
            });

            profileCount.textContent = visibleCount;
            emptyState.hidden = visibleCount > 0;
        }

        async function loadProfiles(term = '') {
            const requestId = ++currentSearchRequest;
            profileGrid.setAttribute('aria-busy', 'true');
            statusMessage.textContent = term ? 'Pesquisando perfis...' : 'Carregando perfis...';
            statusMessage.hidden = false;
            try {
                const user = readStoredJson('pallasUser', {});
                const currentUserId = user.usuario_id?._id || user.usuario_id
                    || user.perfil?.usuario_id?._id || user.perfil?.usuario_id
                    || user.perfil?._id || user._id || '';
                const currentProfile = currentUserId
                    ? readStoredJson(`pallasProfile_${currentUserId}`, null)
                    : null;
                const params = new URLSearchParams();
                if (currentUserId) params.set('exceto', currentUserId);
                if (term) params.set('q', term);
                const query = params.toString();
                const response = await fetch(`/api/sugestoes${query ? `?${query}` : ''}`);
                const result = await response.json();
                if (!response.ok || !result.sucesso || !Array.isArray(result.dados)) {
                    throw new Error(result.mensagem || 'Não foi possível carregar os perfis.');
                }
                if (requestId !== currentSearchRequest) return;

                const profiles = result.dados.map((profile) => {
                    if (!currentProfile || !currentUserId || String(profile.id) !== String(currentUserId)) return profile;

                    const cachedArea = currentProfile.arte || currentProfile.tipo_arte;
                    return {
                        ...profile,
                        nome: currentProfile.nome || profile.nome,
                        login: currentProfile.usuario
                            ? `@${String(currentProfile.usuario).replace(/^@/, '')}`
                            : profile.login,
                        avatar: currentProfile.avatar || profile.avatar,
                        bio: currentProfile.bio || profile.bio,
                        cidade: currentProfile.cidade || currentProfile.endereco?.cidade || profile.cidade,
                        estado: currentProfile.estado || currentProfile.endereco?.uf || profile.estado,
                        area: Array.isArray(cachedArea)
                            ? cachedArea.join(', ')
                            : cachedArea || profile.area
                    };
                });

                profileGrid.replaceChildren(...profiles.map(createProfileCard));
                profileCards = profileGrid.querySelectorAll('.discover-card');
                profileGrid.setAttribute('aria-busy', 'false');
                statusMessage.hidden = true;
                updateProfiles();
            } catch (error) {
                if (requestId !== currentSearchRequest) return;
                console.error('Erro ao carregar perfis da comunidade:', error);
                profileGrid.setAttribute('aria-busy', 'false');
                statusMessage.textContent = 'Não foi possível carregar os perfis. Tente novamente mais tarde.';
            }
        }

        let searchDebounce;
        searchInput.addEventListener('input', () => {
            const term = searchInput.value.trim();
            window.clearTimeout(searchDebounce);
            if (term) {
                searchDebounce = window.setTimeout(() => loadProfiles(term), 250);
            } else {
                loadProfiles();
            }
        });
        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') event.preventDefault();
        });
        filterButtons.forEach((button) => {
            button.addEventListener('click', () => {
                selectedFilter = button.dataset.filter;
                filterButtons.forEach((filterButton) => {
                    const isActive = filterButton === button;
                    filterButton.classList.toggle('is-active', isActive);
                    filterButton.setAttribute('aria-pressed', String(isActive));
                });
                updateProfiles();
            });
        });
        loadProfiles(searchTerm);

        let lastScrollTop = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;
            if (currentScroll > 80 && currentScroll > lastScrollTop) {
                header.classList.add('is-hidden');
            } else {
                header.classList.remove('is-hidden');
            }
            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });
    </script>
</body>
</html>
