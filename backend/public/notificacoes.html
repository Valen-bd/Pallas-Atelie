<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações | Pallas Ateliê</title>
    <link rel="shortcut icon" type="image/png" href="images/PA-TCC logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/user-session.js"></script>
</head>
<body class="entrar-page">
    <header class="social-header">
        <div class="social-header-content">
            <div class="logo">
                <a href="inicial.html">
                    <img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
                </a>
            </div>

            <div class="social-search">
                <i class="bi bi-search" aria-hidden="true"></i>
                <input type="text" placeholder="Pesquisar...">
            </div>

            <div class="social-actions">
                <a href="notificacoes.html" class="icon-badge" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></a>
                <a href="propostas-empresa.html" class="icon-badge propostas-empresa-icon" aria-label="Propostas para empresas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="propostas-artista.html" class="icon-badge propostas-artista-icon" aria-label="Propostas para artistas"><i class="bi bi-megaphone" aria-hidden="true"></i></a>
                <a href="perfil.html" class="profile-mini">
                    <div class="avatar small">U</div>
                    <span>Usuário</span>
                </a>
            </div>
        </div>
    </header>

    <main class="perfil-container">
        <section class="perfil-card notificacoes-card">
            <div class="perfil-header">
                <div class="avatar perfil-avatar">U</div>
                <div class="perfil-identidade">
                    <h1>Notificações</h1>
                    <p>Suas atualizações recentes</p>
                </div>
            </div>

            <div id="notifications-list" aria-live="polite">
                <p class="notificacoes-empty">Carregando notificações...</p>
            </div>
        </section>
    </main>

    <script>
        const header = document.querySelector('.social-header');
        const userType = localStorage.getItem('pallasUserType');
        if (userType === 'empresa') {
            const artistaIcon = document.querySelector('.propostas-artista-icon');
            if (artistaIcon) artistaIcon.style.display = 'none';
        }
        if (userType === 'artista') {
            const empresaIcon = document.querySelector('.propostas-empresa-icon');
            if (empresaIcon) empresaIcon.style.display = 'none';
        }

        let currentUser = {};
        try {
            currentUser = JSON.parse(localStorage.getItem('pallasUser') || '{}');
        } catch (error) {
            console.error('Não foi possível ler os dados da sessão:', error);
        }
        const currentUserId = currentUser.usuario_id?._id || currentUser.usuario_id
            || currentUser.perfil?.usuario_id?._id || currentUser.perfil?.usuario_id
            || currentUser.perfil?._id || currentUser._id || '';
        const notificationsList = document.getElementById('notifications-list');

        function formatNotificationDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '' : date.toLocaleString('pt-BR');
        }

        async function markNotificationsAsViewed(notificationIds) {
            const response = await fetch(`/api/notificacoes/${encodeURIComponent(currentUserId)}/visualizadas`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ notificacaoIds: notificationIds })
            });
            const result = await response.json();
            if (!response.ok || !result.sucesso) {
                throw new Error(result.mensagem || 'Não foi possível marcar as notificações como vistas.');
            }

            document.querySelectorAll('.notification-indicator').forEach((indicator) => indicator.remove());
            const notificationLink = document.querySelector('.social-actions a.icon-badge[href="notificacoes.html"]');
            notificationLink?.setAttribute('aria-label', 'Notificações');
        }

        async function loadNotifications() {
            if (!currentUserId) {
                notificationsList.innerHTML = '<p class="notificacoes-empty">Entre na sua conta para ver as notificações.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/notificacoes/${encodeURIComponent(currentUserId)}`);
                const result = await response.json();
                if (!response.ok || !result.sucesso || !Array.isArray(result.dados)) {
                    throw new Error(result.mensagem || 'Não foi possível carregar as notificações.');
                }

                if (result.dados.length === 0) {
                    notificationsList.innerHTML = '<p class="notificacoes-empty">Você ainda não tem notificações.</p>';
                } else {
                    notificationsList.replaceChildren(...result.dados.map((notification) => {
                        const item = document.createElement('a');
                        item.className = 'notificacao-item';
                        item.href = notification.publicacao_id
                            ? `perfil.html?publicacao=${encodeURIComponent(notification.publicacao_id)}`
                            : 'perfil.html';

                        const avatar = document.createElement('div');
                        avatar.className = 'avatar small notificacao-avatar';
                        if (notification.avatar) {
                            const image = document.createElement('img');
                            image.src = notification.avatar;
                            image.alt = '';
                            avatar.appendChild(image);
                        } else {
                            avatar.textContent = (notification.autor || 'U').charAt(0).toUpperCase();
                        }

                        const content = document.createElement('div');
                        content.className = 'notificacao-conteudo';
                        const title = document.createElement('strong');
                        title.textContent = notification.tipo === 'curtida'
                            ? `${notification.autor} curtiu sua publicação`
                            : `${notification.autor} comentou na sua publicação`;
                        content.appendChild(title);
                        if (notification.texto) {
                            const comment = document.createElement('p');
                            comment.textContent = `“${notification.texto}”`;
                            content.appendChild(comment);
                        }
                        const date = document.createElement('time');
                        date.className = 'notificacao-data';
                        date.dateTime = notification.criado_em || '';
                        date.textContent = formatNotificationDate(notification.criado_em);
                        content.appendChild(date);
                        item.append(avatar, content);
                        return item;
                    }));
                }

                await markNotificationsAsViewed(result.dados.map((notification) => notification.id));
            } catch (error) {
                console.error('Erro ao buscar notificações:', error);
                if (notificationsList.querySelector('.notificacao-item')) {
                    console.error('As notificações foram carregadas, mas podem continuar marcadas como não vistas.');
                } else {
                    notificationsList.innerHTML = '<p class="notificacoes-empty">Não foi possível carregar as notificações.</p>';
                }
            }
        }

        loadNotifications();
        window.setInterval(loadNotifications, 15000);

        let lastScrollTop = 0;

        window.addEventListener('scroll', () => {
            const currentScroll = window.scrollY;

            if (currentScroll > 80 && currentScroll > lastScrollTop) {
                header.classList.add('is-hidden');
            } else {
                header.classList.remove('is-hidden');
            }

            lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        });
    </script>
</body>
</html>
