<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Pallas Ateliê</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="entrar-page">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="images/pa1.png" id="logimagem" alt="Logo Pallas Ateliê">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Início</a></li>
                    <li><a href="sobre.html" class="nav-link">Sobre</a></li>
                    <li><a href="contato.html" class="nav-link">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="frase">
            Bem-vindo de volta!
            <span class="frase-destaque">Entre e continue compartilhando suas artes.</span>
        </div>
        <div class="divider"></div>

        <form class="register-form" action="inicial.html" method="get">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-input" id="email" type="email" placeholder="seu@email.com">

            <label class="form-label" for="senha">Senha</label>
            <input class="form-input" id="senha" type="password" placeholder="********">

            <button class="btn btn-cadastrar register-submit" type="submit">Entrar</button>
        </form>
    </main>
</body>
</html>
