<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Empresa - Pallas Ateliê</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body class="register-page">
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo">
                    <img src="images/pa1.png" id="logimagem" alt="Logo">
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link" data-page="home">Início</a></li>
                    <li><a href="sobre.html" class="nav-link" data-page="about">Sobre</a></li>
                    <li><a href="contato.html" class="nav-link" data-page="contact">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="frase">Cadastro de Empresa</div>
            <div class="divider"></div>

            <form action="inicial.html" method="get" class="register-form">
                <label class="form-label" for="nome-empresa">Nome/Nome fantasia</label>
                <input id="nome-empresa" name="nome-empresa" type="text" class="form-input" placeholder="Digite o nome da empresa" required>

                <label class="form-label" for="razao-social">Razão Social</label>
                <input id="razao-social" name="razao-social" type="text" class="form-input" placeholder="Digite a razão social da empresa" required>

                <label class="form-label" for="responsavel">Responsável</label>
                <input id="responsavel" name="responsavel" type="text" class="form-input" placeholder="Nome do responsável" required>

                <label class="form-label" for="email">E-mail</label>
                <input id="email" name="email" type="email" class="form-input" placeholder="Digite o e-mail de contato" required>

                <label class="form-label" for="pais">País</label>
                <input id="pais" name="pais" type="text" class="form-input" placeholder="Ex: Brasil" required>

                <label class="form-label" for="estado">Estado</label>
                <input id="estado" name="estado" type="text" class="form-input" placeholder="Ex: São Paulo" required>

                <label class="form-label" for="cidade">Cidade</label>
                <input id="cidade" name="cidade" type="text" class="form-input" placeholder="Ex: São Paulo" required>

                <label class="form-label" for="cnpj">CNPJ</label>
                <input id="cnpj" name="cnpj" type="text" class="form-input" placeholder="00.000.000/0000-00" required>

                <label class="form-label" for="fone">Telefone</label>
                <input id="fone" name="fone" type="text" class="form-input" placeholder="(00) 00000-0000" required>

                <label class="form-label" for="area">Tipo de Arte</label>
                <input id="area" name="area" type="text" class="form-input" placeholder="Ex: pintura, cerâmica, digital" required>

                <label class="form-label" for="senha">Senha</label>
                <input id="senha" name="senha" type="password" class="form-input" placeholder="Crie uma senha" required>

                <label class="form-label" for="confirmar-senha">Confirmar senha</label>
                <input id="confirmar-senha" name="confirmar-senha" type="password" class="form-input" placeholder="Repita a senha" required>

                <button type="submit" class="btn btn-cadastrar register-submit">Cadastrar-se como empresa</button>
            </form>

            <div class="divider"></div>
            <a href="cadastrar.html" class="btn btn-entrar back-button">Voltar</a>
        </div>
    </main>
    <script>
        document.querySelector('.register-form').addEventListener('submit', function(event) {
            localStorage.setItem('pallasUserType', 'empresa');
        });
    </script>
